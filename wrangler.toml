name = "hamptonjersey"
pages_build_output_dir = "site"
compatibility_date = "2025-10-01"

[vars]
PUB08_CONTENT_READY = "1"
PUB06_STRUCTURED_ECONOMICS_READY = "1"
PUB09_WITHDRAWALS_READY = "1"
VIS09_VIEWING_POLICY_READY = "1"
OFE06_WEEKLY_REVIEW_READY = "1"
AUT10_MODES_READY = "1"
LISTING_HEALTH_READY = "1"
ADM06_TENANCY_ORIGIN_READY = "1"
AGE14_SUPPRESSION_READY = "1"
PUB11_DOCUMENTS_READY = "1"
# ADM-16: off until migration 0059 is applied.
ADM16_TENANCY_EXIT_READY = "1"
# ADM-13: off until migration 0060 is applied.
ADM13_INSPECTIONS_READY = "1"
EMAIL_SERVICE_READY = "false"
FIREBASE_PROJECT_ID = "hamptonestatesjersey"
# Clave pública (site key) del widget "hamptonjersey viewings"; en local .dev.vars usa la de prueba.
TURNSTILE_SITE_KEY = "0x4AAAAAAFQB3xGjTWfMlGS5"
# S5: the one host search engines index; canonicals, og:url, sitemap and robots point here. Change it with the domain.
SITE_URL = "https://www.hamptonestatesjersey.com"

[[d1_databases]]
binding = "DB"
database_name = "hampton"
database_id = "1da41b63-c61f-4491-9f8d-3a9afde6e0fb"
migrations_dir = "migrations"

# Synthetic QA database only; no business data or admin identities.
[[d1_databases]]
binding = "QA_DB"
database_name = "hampton-qa-history"
database_id = "9e17c73a-050c-4855-85ea-5b42236a0015"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "hampton-media"

# Previews are static-only: never bind business or QA data/storage there.
[env.preview]
d1_databases = []
r2_buckets = []
