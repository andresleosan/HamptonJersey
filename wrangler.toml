name = "hamptonjersey"
pages_build_output_dir = "site"
compatibility_date = "2025-10-01"

[vars]
PUB08_CONTENT_READY = "1"
# PUB-21: Properties Queue sends Drive folders to Hermes (custodio-cola + lector on the VPS). Paused 14-nov-2026
# by the master plan; switched back on 16-nov-2026 at Luis's request. "0" pauses it again; queued imports stay reviewable.
PUB21_DRIVE_READY = "1"
PUB06_STRUCTURED_ECONOMICS_READY = "1"
PUB09_WITHDRAWALS_READY = "1"
VIS09_VIEWING_POLICY_READY = "1"
OFE06_WEEKLY_REVIEW_READY = "1"
AUT10_MODES_READY = "1"
LISTING_HEALTH_READY = "1"
ADM06_TENANCY_ORIGIN_READY = "1"
AGE14_SUPPRESSION_READY = "1"
PUB11_DOCUMENTS_READY = "1"
# ADM-16: off until migration 0059 is applied.
ADM16_TENANCY_EXIT_READY = "1"
# ADM-13: off until migration 0060 is applied.
ADM13_INSPECTIONS_READY = "1"
# NOT-05: needs no migration; off until its tab is checked in production.
NOT05_MISSING_PAYMENTS_READY = "1"
# BUS-06 / BUS-19: market inventory and source review (migration 0043, applied 14-nov-2026).
MARKET_INVENTORY_READY = "1"
# PUB-07: listing compliance (migration 0061, applied 14-nov-2026).
PUB07_COMPLIANCE_READY = "1"
# ADM-17: versioned legal periods (migration 0063, applied 14-nov-2026); keep equal in jobs/wrangler.toml.
ADM17_LEGAL_TERMS_READY = "1"
# VIS-10: house rules for viewings (migration 0066, applied 14-nov-2026); reads occupancy from PUB-07.
VIS10_HOUSE_RULES_READY = "1"
# EST-01 / SAP-01: last run of each search (migration 0067, applied 14-nov-2026). Never together with EST01_PROGRESS_READY.
EST01_SEARCH_STATE_READY = "1"
# ADM-11: the rest of the rental compliance calendar (no migration); keep equal in jobs/wrangler.toml.
ADM11_CALENDAR_READY = "1"
# VIS-08: Reminded and Feedback received in the viewing cycle (migration 0071, applied 15-nov-2026).
VIS08_CYCLE_READY = "1"
# BUS-10: one physical home per market listing, reviewed by a person (migrations 0050 and 0068, applied 15-nov-2026).
BUS10_IDENTITY_READY = "1"
# VIS-04: a follow-up task after a viewing's decision (no migration).
VIS04_OUTCOME_READY = "1"
# AUT-19: criteria proposals with before/after and confirmation (migration 0074, applied 15-nov-2026).
AUT19_CRITERIA_PROPOSALS_READY = "1"
# EST-16: confirmed availability apart from the listing's status (migration 0072, applied 15-nov-2026).
EST16_AVAILABILITY_READY = "1"
# ADM-20: 2025 tenancy rules checked on create, edit, renew and charges (migration 0073, applied 15-nov-2026). Website only.
ADM20_TENANCY_LAW_READY = "1"
# EST-15: a confirmed unavailability withdraws proposals and flags viewings (migration 0076, applied 15-nov-2026; needs EST16_AVAILABILITY_READY).
EST15_UNAVAILABILITY_READY = "1"
# AGE-03: shared property enquiries prepared from approved matches (migration 0077, applied 15-nov-2026). Sends nothing.
AGE03_ENQUIRIES_READY = "1"
# SPR-08: viewings, notes and adverts on the property (migration 0079, applied 15-nov-2026).
SPR08_SECTIONS_READY = "1"
# SAP-02 / SAP-03 / EST-04: confirmed and available counts, match filters and In process from open enquiries (no migration).
SAP02_COUNTS_READY = "1"
# ADM-15: rent review on the 2025 rules with a sourced RPI and a notice draft (no migration; needs ADM20_TENANCY_LAW_READY).
ADM15_RENT_REVIEW_READY = "1"
# AGE-05: enquiry emails to advertisers, each approved by a person. Switched on 24-nov-2026 by Luis; keep equal in
# jobs/wrangler.toml (a test checks it). To stop, switch off in jobs/wrangler.toml too: the clock sends what is queued.
AGE05_SEND_READY = "1"
# OFE-02: from Sales, an open offer emailed to its seller (an owner in the Advertisers directory), each email approved
# by a team member and sent through the approved queue (migration 0126). Sends messages: only Luis switches it on, here
# and in jobs/wrangler.toml at the same time (a test checks it). Off, the clock takes back what is queued.
OFE02_SEND_READY = "0"
# PUB-10: the public «Sell or let» form receives owners' requests (migration 0118). Also needs the app_settings row
# owner_enquiries = {"enabled":true,"privacy_version":...} of the published owners' notice (PRE-09, JOIC of PRE-03).
# Collects personal data from the public: switched on 25-nov-2026 by decision of Luis (12 months retention, notice 2026-11-25).
OWNER_REQUESTS_READY = "1"
# ANA-05: per-search milestones in Insights from offers, sales and search state (no migration).
SEARCH_MILESTONES_READY = "1"
# BUS-07 / SPR-07: listing source, web sighting vs confirmation, and a reviewed market-home link (migration 0081, applied 15-nov-2026).
BUS07_PROVENANCE_READY = "1"
# AGE-06: answers to sent enquiries recorded as EST-16 confirmations (migration 0082, applied 15-nov-2026). Sends nothing.
AGE06_RESPONSES_READY = "1"
# BUS-01/BUS-03: market inventory homes matched against active searches (migration 0083, applied 15-nov-2026). Sends nothing.
BUS01_MARKET_MATCHING_READY = "1"
# AGE-08: one Inbox task to call the advertiser two working days after an enquiry was sent with no useful answer (no migration; sends nothing). Must match the other wrangler.toml.
AGE08_CALL_TASKS_READY = "1"
# AGE-09: each enquiry opens the evidence of what it shared with the advertiser (general check or one search's own case),
# who approved it, the matches it served, the answers and the call (no migration; reads only, needs AGE03_ENQUIRIES_READY).
# Writes and sends nothing; the clock does not read it.
AGE09_EVIDENCE_READY = "1"
# SPR-03: a confirmation that says available captures one shared property record, its files and downloads (migration 0084, applied 15-nov-2026; needs EST16_AVAILABILITY_READY). Sends nothing.
SPR03_CAPTURE_READY = "1"
# AGE-10: the team marks which captured photos are fit for a private presentation, with their provenance (migration 0085, applied 15-nov-2026; needs SPR03_CAPTURE_READY and EST16_AVAILABILITY_READY). Publishes and sends nothing.
AGE10_PHOTOS_READY = "1"
# AGE-12: a client's private link to the homes presented, with their answer on each (migration 0086; needs AGE10_PHOTOS_READY, SPR03_CAPTURE_READY and EST16_AVAILABILITY_READY). Public route that collects client answers: only Luis switches it on.
AGE12_PRESENTATIONS_READY = "1"
# AGE-11: a person reviews and approves the snapshot of a private presentation (homes, availability confirmation and its date, price, AGE-10's suitable photos) before sending AGE-12's link; any change after the approval needs approving again, and the client's page shows only the approved snapshot (migration 0115; needs AGE12_PRESENTATIONS_READY). Sends nothing.
AGE11_REVIEW_READY = "1"
# NOT-08/NOT-09: Inbox Agency replies/Messages from real tasks, and Approve/Call/Reply/Snooze in each notice (migration 0088, applied 15-nov-2026). Sends nothing.
NOT0809_INBOX_READY = "1"
# PUB-16: a rental recorded as let shows Let agreed for 24 hours, then leaves the website; 24 hours after a letting or sale its other viewings get Inbox tasks (migration 0087, applied 15-nov-2026). Sends nothing. Must match the other wrangler.toml.
PUB16_TIMED_CLOSURE_READY = "1"
# EST-19: Listings shows properties confirmed not available and what the six-month photo purge would delete and when (no migration; needs EST15_UNAVAILABILITY_READY and EST16_AVAILABILITY_READY). Deletes nothing.
EST19_TRASH_READY = "1"
# EST-19: a person deletes, a batch per click, the external reference photos due six months after a property entered the trash (no migration; needs EST19_TRASH_READY). Deletes production files: only Luis switches it on.
EST19_PURGE_READY = "1"
# ADM-12: repair suppliers directory and the landlord's approval recorded by the team (migration 0089, applied 15-nov-2026). Sends nothing.
ADM12_SUPPLIERS_READY = "1"
# ADM-12: the tenant's link to report a repair (6-digit code by email, 30-minute session; migration 0110). Needs the
# secret CASE_CHALLENGE_HMAC_KEY, migrations 0046 and 0049 (ADM-18 capabilities) to create links, and AUT-17 (the EMAIL
# binding here and EMAIL_SERVICE_READY) to send codes. Collects reports from tenants: only Luis switches it on.
ADM12_CASE_ACCESS_READY = "0"
# ADM-18: the applicant's rental application through a private link (same sign-in as ADM-12; migration 0117, not applied)
# and the team's decision with the affordability rule. Needs CASE_CHALLENGE_HMAC_KEY, migrations 0046 and 0049 (ADM-18
# capabilities on the property), AUT-17 to send codes, and Hampton's approved criteria. Collects employment and income
# from applicants: only Luis switches it on.
ADM18_APPLICATION_READY = "0"
# ADM-18: Hampton's affordability criteria, pending their approval (17-nov-2026). While any value is ### every result is
# "needs human review": version, basis "gross" or "net", max_rent_share (most of a year's income the year's rent may take,
# 0 to 1) and sources (where the rule comes from).
ADM18_AFFORDABILITY_POLICY = '{"version":"###","basis":"###","max_rent_share":"###","sources":"###"}'
# ADM-09: arrears drafts (+1/+5/+14 letter, not validated by a lawyer) and recorded write-offs; net debt everywhere (migration 0045, applied 15-nov-2026). Sends nothing. Must match the other wrangler.toml.
ADM09_ARREARS_READY = "1"
# ADM-10: close each month's landlord statement as a frozen revision; record sent and paid by hand (migration 0090, applied 15-nov-2026). Sends nothing. Must match the other wrangler.toml.
ADM10_STATEMENTS_READY = "1"
# ANA-10: window poster QR per published property and aggregate opens per day (day, listing, count; no personal data) (migration 0091, applied 15-nov-2026). Sends nothing.
ANA10_QR_OPENS_READY = "1"
# ADM-14: renewal answers from landlord and tenant recorded by hand, drafts to copy, Renew/End prefilled, listing draft when the tenancy ends (no migration). Website only. Sends nothing.
ADM14_RENEWAL_READY = "1"
# ANA-06: Insights shows the median agency response time in working hours, no agency names (migration 0092, applied 15-nov-2026). Read only.
ANA06_AGENCY_TIMES_READY = "1"
# PRE-14: weekly encrypted backup write gate (migration 0094). Off until every writer in docs/roadmap/work/PRE-14/writer-coverage.md is covered; keep equal in the other wrangler.toml.
BACKUP_READY = "0"
# MSG-03: a person links a website chat to an existing contact from Messages, and the contact's record lists its chats (migration 0093, applied 16-nov-2026). Sends nothing.
MSG03_CONTACT_LINK_READY = "1"
# PRE-10: marketing objection per purpose and channel in the panel, and the consent check of every promotional email right before it is sent (migration 0096, applied 16-nov-2026). Sends nothing; keep equal in the other wrangler.toml.
PRE10_PURPOSE_READY = "1"
# BUS-08: the daily market sweep (migration 0095). Off: no automatic source reader exists or is authorised yet (BUS-19). Before switching on, jobs/wrangler.toml must carry the website's values of the flags a recompute reads (a test checks it). Must match the other wrangler.toml.
BUS08_SWEEP_READY = "1"
# MSG-05: a person creates an applicant from a website chat, with its contact details filled in and an explicit Save; one batch writes the contact, the search and the chat's link (migration 0098, applied 16-nov-2026; needs MSG03_CONTACT_LINK_READY). Sends nothing.
MSG05_CREATE_READY = "1"
# BUS-04: the market's changes cross again only the active searches they affect, with one Inbox task per search for homes newly proposed or back at a lower price (migration 0097). Sends nothing. Needs the same recompute flags in both files as BUS-08 (a test checks it). Must match the other wrangler.toml.
BUS04_REMATCH_READY = "1"
# BUS-09: a market advert missing from two complete reads of its channel (initial or daily, none with adverts left out) after it was last read is no longer offered to searches; nothing is deleted and a later read brings it back. Off: as before. Must match the other wrangler.toml.
MARKET_AUTO_WITHDRAW_READY = "0"
# BUS-17: one internal Inbox review of an active search 21 days without a complete option (every must-have met and availability confirmed by a person), then 7 days after each closed review, with up to 20 explained alternatives; and a task when a rejected home's price drops 5% (migration 0099). Sends nothing and changes no criteria or match. Needs EST01_SEARCH_STATE_READY, EST16_AVAILABILITY_READY and EST15_UNAVAILABILITY_READY in both files. Must match the other wrangler.toml.
BUS17_REVIEW_READY = "1"
PRE12_REQUESTS_READY = "1"
# PRE-12: a team member confirms one by one which viewing requests matched only by email or phone belong to a privacy
# request's contact; only those enter the copy (migration 0111). Migration 0111 applied 16-nov-2026. Sends nothing.
PRE12_VIEWING_REVIEW_READY = "1"
# PRE-12 (Q05): an email notice in a contact's 12th month without activity; the retention pass deletes a contact with an
# email only a month after its notice was accepted, and a failed, uncertain or answered one keeps it with an Inbox task
# (migration 0112; needs EMAIL_SERVICE_READY to send). Sends messages: only Luis switches it on, once he has approved
# its text. Apply 0112 before switching on, and switch on (or off) in both wrangler.toml files at once. Must match the
# other wrangler.toml.
PRE12_RETENTION_NOTICE_READY = "0"
# PRE-12 (D4): a team member links the tenant of a tenancy to a contact, one click each (a matching email or phone only
# proposes it); linked tenancies enter the privacy copy (identity, address and dates) and a running one keeps its contact
# from the retention pass and the applicant's Delete (migration 0113). Sends nothing. Apply 0113 before switching on.
# Must match the other wrangler.toml.
PRE12_TENANCY_LINK_READY = "1"
AUT18_TEAM_READY = "1"
ADM19_SIGNATURE_READY = "1"
VIS14_BLOCK_READY = "1"
# VIS-17: a viewing coordinated with several people: the team proposes one time, records each required person's answer
# (client always; advertiser or agency and the negotiator when chosen) with how and when, and the viewing is confirmed
# only once all have accepted (migration 0114). Sends nothing; no client-facing page. Apply 0114 before switching on.
VIS17_MULTIPART_READY = "1"
# EST-14: each match's journey (Interested, Viewing booked, Viewed, Offer, Agreed, Not interested) from AGE-12's answers,
# VIS-17's linked viewings with VIS-04's answer, offers, sales and ADM-06's tenancies, and the client's word recorded by
# the team with a reason (migration 0116). Changes no criteria, match decision, availability or search; sends nothing.
# Apply 0116 before switching on.
EST14_JOURNEY_READY = "1"
# EST-10: the applicants list adds, as work labels beside the match ones, a must-have to confirm on a match, a viewing
# pending or booked that a person linked to the search (VIS-17, needs VIS17_MULTIPART_READY) and BUS-17's 21-day review
# while open (needs BUS17_REVIEW_READY). No migration; reads only, in the list's own query. Closes no search, changes no
# criteria, sends nothing. Off: the list is read exactly as before. The clock does not read it.
EST10_LABELS_READY = "1"
EMAIL_SERVICE_READY = "false"
# AUT-17: email through Hampton's Gmail by Hermes's mail carrier (migrations 0121, 0122): the app's approved queue,
# verbatim, and the emails Hermes writes (enquiries waiting by hand, VIS-17 viewing proposals) as Gmail drafts or, with
# each type's switch in Automations, sent. The door opens only with the secret HERMES_MAIL_KEY. Sends messages: only Luis
# switches it on, here and in jobs/wrangler.toml at the same time, once Gmail is connected.
HERMES_MAIL_READY = "1"
# VIS-13: the client's reminders 24 h and 2 h before a confirmed viewing linked to their search (VIS-17), one approved-queue
# email each, sent verbatim through the carrier with no review one by one (the switch is the approval), and Confirm /
# another time / Cancel on AGE-12's private page. Sends messages: only Luis switches it on, in both wrangler.toml at once.
VIS13_REMINDERS_READY = "0"
# AUT-22: the week's saved Insights (weekly_insights) by email to the team summary's recipients and its configuration
# revision (Settings > Automations), once per week and recipient, never to an owner, through the approved queue sent by
# Hermes's carrier (no migration). Sends messages: only Luis switches it on, here and in jobs/wrangler.toml at once.
AUT22_WEEKLY_EMAIL_READY = "0"
# BUS-09: Hermes reads the market's allowed channels of the sources in HERMES_MARKET_SOURCES (comma list, "*": all) through
# its own door (/api/hermes/market/*, secret HERMES_MARKET_KEY, held by the market custodian on the VPS); the daily sweep
# leaves those channels to it, also when a code reader exists. No migration. Keep equal in jobs/wrangler.toml.
HERMES_MARKET_READY = "1"
HERMES_MARKET_SOURCES = "src-gaudin-co,src-keys-properties,src-finders-keepers"
# REG-15: «Save this search» for website visitors and a daily email of new homes through the email pipeline (migration 0107; needs PRE10_PURPOSE_READY). Collects emails from the public and sends: only Luis switches it on. Must match the other wrangler.toml.
REG15_ALERTS_READY = "0"
# ANA-04: anonymous daily counts of the website's search filters and Insights' Search trends, with their 90-day retention (migration 0108). Switched on 17-nov-2026 by Luis (0108 applied; privacy notice updated).
ANA04_SEARCH_STATS_READY = "1"
# MSG-01 / PRE-08: messages to Hampton's Facebook page arrive through Meta's signed webhook (/api/meta/webhook) and show in
# Messages (migration 0109). Needs the PRE-02 app and the secrets META_APP_SECRET, META_VERIFY_TOKEN and META_PAGE_ID.
# Collects messages from the public: only Luis switches it on. Must match the other wrangler.toml (its retention).
# Switched on 25-nov-2026 by Luis so Meta can verify the webhook address; META_VERIFY_TOKEN is set, and until Luis
# loads META_APP_SECRET and META_PAGE_ID every POST is refused (503) and nothing is stored.
META_MESSAGES_READY = "1"
# MSG-01: a person's reply from Messages goes to Facebook (Send API, within 24 hours of their last message; needs
# META_PAGE_TOKEN). Sends messages: only Luis switches it on. His yes of 25-nov-2026 is for after his own test message.
META_SEND_READY = "0"
FIREBASE_PROJECT_ID = "hamptonestatesjersey"
# Clave pública (site key) del widget "hamptonjersey viewings"; en local .dev.vars usa la de prueba.
TURNSTILE_SITE_KEY = "0x4AAAAAAFQB3xGjTWfMlGS5"
# S5: the one host search engines index; canonicals, og:url, sitemap and robots point here. Change it with the domain.
SITE_URL = "https://www.hamptonestatesjersey.com"

[[d1_databases]]
binding = "DB"
database_name = "hampton"
database_id = "1da41b63-c61f-4491-9f8d-3a9afde6e0fb"
migrations_dir = "migrations"

# Synthetic QA database only; no business data or admin identities.
[[d1_databases]]
binding = "QA_DB"
database_name = "hampton-qa-history"
database_id = "9e17c73a-050c-4855-85ea-5b42236a0015"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "hampton-media"

# Previews are static-only: never bind business or QA data/storage there.
[env.preview]
d1_databases = []
r2_buckets = []
