name = "hamptonjersey"
pages_build_output_dir = "site"
compatibility_date = "2025-10-01"

[vars]
PUB08_CONTENT_READY = "1"
PUB06_STRUCTURED_ECONOMICS_READY = "1"
PUB09_WITHDRAWALS_READY = "1"
VIS09_VIEWING_POLICY_READY = "1"
OFE06_WEEKLY_REVIEW_READY = "1"
AUT10_MODES_READY = "1"
LISTING_HEALTH_READY = "1"
ADM06_TENANCY_ORIGIN_READY = "1"
AGE14_SUPPRESSION_READY = "1"
PUB11_DOCUMENTS_READY = "1"
# ADM-16: off until migration 0059 is applied.
ADM16_TENANCY_EXIT_READY = "1"
# ADM-13: off until migration 0060 is applied.
ADM13_INSPECTIONS_READY = "1"
# NOT-05: needs no migration; off until its tab is checked in production.
NOT05_MISSING_PAYMENTS_READY = "1"
# BUS-06 / BUS-19: market inventory and source review (migration 0043, applied 14-nov-2026).
MARKET_INVENTORY_READY = "1"
# PUB-07: listing compliance (migration 0061, applied 14-nov-2026).
PUB07_COMPLIANCE_READY = "1"
# ADM-17: versioned legal periods (migration 0063, applied 14-nov-2026); keep equal in jobs/wrangler.toml.
ADM17_LEGAL_TERMS_READY = "1"
# VIS-10: house rules for viewings (migration 0066, applied 14-nov-2026); reads occupancy from PUB-07.
VIS10_HOUSE_RULES_READY = "1"
# EST-01 / SAP-01: last run of each search (migration 0067, applied 14-nov-2026). Never together with EST01_PROGRESS_READY.
EST01_SEARCH_STATE_READY = "1"
# ADM-11: the rest of the rental compliance calendar (no migration); keep equal in jobs/wrangler.toml.
ADM11_CALENDAR_READY = "1"
# VIS-08: Reminded and Feedback received in the viewing cycle (migration 0071, applied 15-nov-2026).
VIS08_CYCLE_READY = "1"
# BUS-10: one physical home per market listing, reviewed by a person (migrations 0050 and 0068, applied 15-nov-2026).
BUS10_IDENTITY_READY = "1"
# VIS-04: a follow-up task after a viewing's decision (no migration).
VIS04_OUTCOME_READY = "1"
# AUT-19: criteria proposals with before/after and confirmation (migration 0074, applied 15-nov-2026).
AUT19_CRITERIA_PROPOSALS_READY = "1"
# EST-16: confirmed availability apart from the listing's status (migration 0072, applied 15-nov-2026).
EST16_AVAILABILITY_READY = "1"
EMAIL_SERVICE_READY = "false"
FIREBASE_PROJECT_ID = "hamptonestatesjersey"
# Clave pública (site key) del widget "hamptonjersey viewings"; en local .dev.vars usa la de prueba.
TURNSTILE_SITE_KEY = "0x4AAAAAAFQB3xGjTWfMlGS5"
# S5: the one host search engines index; canonicals, og:url, sitemap and robots point here. Change it with the domain.
SITE_URL = "https://www.hamptonestatesjersey.com"

[[d1_databases]]
binding = "DB"
database_name = "hampton"
database_id = "1da41b63-c61f-4491-9f8d-3a9afde6e0fb"
migrations_dir = "migrations"

# Synthetic QA database only; no business data or admin identities.
[[d1_databases]]
binding = "QA_DB"
database_name = "hampton-qa-history"
database_id = "9e17c73a-050c-4855-85ea-5b42236a0015"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "hampton-media"

# Previews are static-only: never bind business or QA data/storage there.
[env.preview]
d1_databases = []
r2_buckets = []
