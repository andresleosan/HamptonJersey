# AUT-07: the clock. A Worker beside the Pages project, on the website's D1 and with no URL: Cloudflare wakes it every
# 10 minutes (UTC) to run what is due (server/jobs.js). Workers Builds deploys it on each push to main from this folder:
# root directory "jobs", build command "cd .. && npm ci --ignore-scripts",
# deploy command "../node_modules/.bin/wrangler deploy", build variable SKIP_DEPENDENCY_INSTALL=1, preview builds off.
# The build holds the account's deploy token, so it installs only the repo's lockfile and runs no install scripts. Its
# own folder because Workers Builds checks the name in the Wrangler file of its root directory, and at the repo root
# that file is the website's. First deploy, by hand from the repo root: npx wrangler deploy -c jobs/wrangler.toml
name = "hampton-jobs"
main = "../server/jobs.js"
compatibility_date = "2025-10-01"
workers_dev = false
preview_urls = false

[vars]
# Set true only after real service/domain/routing setup and the approved activation check.
# AGE-08: one Inbox task to call the advertiser two working days after an enquiry was sent with no useful answer (no migration; sends nothing). Must match the other wrangler.toml.
AGE08_CALL_TASKS_READY = "1"
# PUB-16: a rental recorded as let shows Let agreed for 24 hours, then leaves the website; 24 hours after a letting or sale its other viewings get Inbox tasks (migration 0087, applied 15-nov-2026). Sends nothing. Must match the other wrangler.toml.
PUB16_TIMED_CLOSURE_READY = "1"
# ADM-09: arrears drafts (+1/+5/+14 letter, not validated by a lawyer) and recorded write-offs; net debt everywhere (migration 0045, applied 15-nov-2026). Sends nothing. Must match the other wrangler.toml.
ADM09_ARREARS_READY = "1"
# ADM-10: close each month's landlord statement as a frozen revision; record sent and paid by hand (migration 0090, applied 15-nov-2026). Sends nothing. Must match the other wrangler.toml.
ADM10_STATEMENTS_READY = "1"
# ADM-13/ADM-03: the six-monthly inspection's Inbox task follows the panel (migration 0060, applied). Sends nothing. Must match the other wrangler.toml.
ADM13_INSPECTIONS_READY = "1"
EMAIL_SERVICE_READY = "false"
# OFE-06: weekly internal sale review (migration 0053); still off until the team sets a day and time.
OFE06_WEEKLY_REVIEW_READY = "1"
# ADM-17: versioned legal periods (migration 0063); keep equal in ../wrangler.toml.
ADM17_LEGAL_TERMS_READY = "1"
# ADM-11: the rest of the rental compliance calendar; keep equal in ../wrangler.toml.
ADM11_CALENDAR_READY = "1"
# AGE-05: enquiry emails to advertisers. Off; keep equal in ../wrangler.toml. To stop, switch off here first.
AGE05_SEND_READY = "0"
# PRE-14: weekly encrypted backup write gate (migration 0094). Off until every writer in docs/roadmap/work/PRE-14/writer-coverage.md is covered; keep equal in the other wrangler.toml.
BACKUP_READY = "0"

[triggers]
crons = ["*/10 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "hampton"
database_id = "1da41b63-c61f-4491-9f8d-3a9afde6e0fb"

# Workers Logs: the Worker logs counts and errors only, never who.
[observability]
enabled = true

[[send_email]]
name = "EMAIL"
allowed_sender_addresses = ["hello@hamptonestatesjersey.com"]
