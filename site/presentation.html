<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Your selection · Hampton Estates</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<!-- AGE-12: a client's private selection. No analytics, fonts or anything else from a third party; nothing kept in the browser. -->
<style>
:root{--ink:#151515;--paper:#fff;--mist:#f4f3f0;--line:#e3e0da;--stone:#6b665e;--bronze:#a56b3d;--bronze-dk:#86542d;--ok:#2f6b4f;--err:#a32020;
  --field-line:#8f8a82;--display:"Tenor Sans","Gill Sans",Optima,sans-serif;--body:Montserrat,"Helvetica Neue",Arial,sans-serif;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:400 14px/1.5 var(--body)}
img{max-width:100%;display:block}
:focus-visible{outline:2px solid var(--bronze);outline-offset:2px}
.wrap{max-width:1240px;margin:0 auto;padding-inline:16px}
header{border-bottom:1px solid var(--line);padding-block:18px}
.brand{font-family:var(--display);font-size:19px;letter-spacing:.06em}
h1,h2{font-family:var(--display);font-weight:400;margin:0;text-wrap:balance}
h1{font-size:26px;margin-top:32px}
h2{font-size:19px}
.lead{color:var(--stone);max-width:68ch}
.homes{display:grid;gap:24px;margin-block:24px 40px;padding:0;list-style:none;max-width:760px}
.home{border:1px solid var(--line);border-radius:14px;padding:24px;display:grid;gap:14px;min-width:0}
.viewings{display:grid;gap:16px;margin-top:40px}
.photos{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:4px}
.photos img{flex:0 0 min(80%,360px);aspect-ratio:4/3;object-fit:cover;border-radius:14px;background:var(--mist);scroll-snap-align:start}
.facts{color:var(--stone);margin:0}
.price{font-weight:600;margin:0}
fieldset{border:0;margin:0;padding:0;min-width:0}
legend{padding:0;font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--stone);margin-bottom:8px}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opts label{cursor:pointer;position:relative}
.opts input{position:absolute;opacity:0;pointer-events:none}
.opts span{display:inline-flex;align-items:center;min-height:44px;border:1px solid var(--field-line);border-radius:999px;padding:9px 18px;font-size:13px;background:#fff}
.opts label:hover span{border-color:var(--stone)}
.opts input:checked+span{background:var(--ink);border-color:var(--ink);color:#fff}
.opts input:focus-visible+span{outline:2px solid var(--bronze);outline-offset:2px}
.note{display:grid;gap:6px;font-size:12px;color:var(--stone)}
textarea{font:inherit;color:inherit;min-height:88px;border:1px solid var(--field-line);border-radius:10px;padding:10px 12px;background:#fbfaf8;width:100%}
textarea:focus{outline:none;border-color:var(--bronze);background:#fff;box-shadow:0 0 0 3px rgba(165,107,61,.15)}
.btn{justify-self:start;display:inline-flex;align-items:center;min-height:44px;border:1px solid var(--ink);border-radius:999px;background:var(--ink);color:#fff;
  padding:10px 20px;font:600 12px/1 var(--body);letter-spacing:.16em;text-transform:uppercase;cursor:pointer}
.btn:hover:not(:disabled){background:var(--bronze-dk);border-color:var(--bronze-dk)}
.btn:disabled{opacity:.45;cursor:default}
.answered{color:var(--ok);font-weight:600;margin:0}
.err{color:var(--err);margin:0}
footer{border-top:1px solid var(--line);padding-block:24px;color:var(--stone);font-size:13px}
footer a{color:inherit}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
</style>
</head>
<body>
<header><div class="wrap"><span class="brand">Hampton Estates</span></div></header>
<main class="wrap" id="app" aria-live="polite"><h1>Your selection</h1><p role="status">Loading your selection…</p></main>
<footer><div class="wrap"><p>Questions, or a request about your personal data: call <a href="tel:+441534727582">+44 1534 727582</a> or read our
  <a href="/#/privacy" rel="noopener noreferrer">privacy notice</a>.</p></div></footer>
<script type="module" src="/presentation.js"></script>
</body>
</html>
